name: stats

# Snapshots adoption stats daily into the `stats` branch. GitHub only keeps
# traffic for 14 days, so this is the long-term history.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the stats branch
        run: |
          if git ls-remote --exit-code --heads origin stats >/dev/null; then
            git fetch --depth 1 origin stats
            git worktree add stats-data origin/stats
          else
            git worktree add --detach stats-data
            git -C stats-data checkout --orphan stats
            git -C stats-data rm -rqf .
          fi
      - name: Collect
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python3 scripts/stats/collect.py stats-data
      - name: Commit
        working-directory: stats-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "stats: $(date -u +%F)"
          git push origin HEAD:stats
